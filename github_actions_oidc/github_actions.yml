AWSTemplateFormatVersion: '2010-09-09'
Description: OIDC integration from Github Actions to access AWS resources

Parameters:
  TrustedGithubOrgOrRepoImmutable:
    Type: String
    Default: ''
    Description: >-
      Preferred. The GitHub organization or repository in the immutable subject claim format,
      which carries permanent numeric IDs (e.g., awesome-foundation@144436715/* or
      awesome-foundation@144436715/core-infrastructure@1109355301). GitHub issues tokens in this
      format for every repository created, renamed, or transferred on or after 2026-07-15.
      Read the exact value from `gh api /repos/OWNER/REPO/actions/oidc/customization/sub`.
      Never replace a numeric ID with a wildcard, because org-name* also matches org-name-attacker.

  TrustedGithubOrgOrRepo:
    Type: String
    Default: ''
    Description: >-
      Legacy name-based format, in the format owner/repo (e.g., awesome-foundation/* or
      awesome-foundation/core-infrastructure). Keep this set until every repository uses the
      immutable format, then clear it. Set at least one of the two parameters.

Conditions:
  TrustImmutableSubject: !Not [!Equals [!Ref TrustedGithubOrgOrRepoImmutable, '']]
  TrustLegacySubject: !Not [!Equals [!Ref TrustedGithubOrgOrRepo, '']]

Resources:
  # GHA = GitHub Actions
  GHAOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
        # - 1b511abead59c6ce207077c0bf0e0043b1382612

  GHAAllowAllRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 'awesome-gha-allow-all-role'
      MaxSessionDuration: 3600 # 1 hour, in seconds
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !Ref GHAOidcProvider
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # IAM applies OR across the values. An empty parameter drops its entry.
                # Both parameters empty leaves an empty list, and stack creation fails.
                token.actions.githubusercontent.com:sub:
                  - !If [TrustImmutableSubject, !Sub 'repo:${TrustedGithubOrgOrRepoImmutable}:*', !Ref "AWS::NoValue"]
                  - !If [TrustLegacySubject, !Sub 'repo:${TrustedGithubOrgOrRepo}:*', !Ref "AWS::NoValue"]
      Policies:
        - PolicyName: 'awesome-gha-allow-all-policy'
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: "*"
                Resource: "*"
